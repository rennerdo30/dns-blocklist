# Dependabot configuration.
#
# Monthly, with every update for an ecosystem grouped into a single pull
# request, to keep the review queue small for a low-traffic repository. A
# cooldown skips releases younger than a week. Security updates are grouped
# per ecosystem and are not delayed.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(actions):"
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
